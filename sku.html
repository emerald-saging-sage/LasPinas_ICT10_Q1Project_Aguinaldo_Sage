<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

<style>
        body {
            background: linear-gradient(135deg, #8dbb38, #f49fb8);
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }


        .main-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(41, 95, 111, 0.2);
        }

        .header {
            background: #bd4f6c;
            color: white;
            padding: 30px;
            text-align: center;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<br>

<div class="container">
    <div class="card main-card">

        <div class="header">
            <h1>SKU Generator</h1>
            <p class="mb-0">Python Variables and Data Types</p>
        </div>

        <div class="card-body p-4">
            <label for="category">Product Category</label>
            <br>
                <select name="category" id="category">
                <option value disabled selected>Select a Category</option>
                <option value="TEA">Teas</option>
                <option value="SUPP">Supplies</option>
                </select>
            <br>
            <br>
                <label for="product_name">Product Name</label>
                <br>
                <input type="text" id="product_name" placeholder="ex: Black Tea">
            <br>
            <br>
                <label for="quantity">Stock Quantity</label>
            <br>
                <input type="text" id="quantity" placeholder="ex: 69">
            <br>
            <br>

                <button class="btn btn-success w-100 mb-1" onclick="generateSKU()">Generate SKU</button>
            <br>
            <br>
                <div class="output" id="output">
                    <p>SKU will appear here.</p>
                </div>
        </div>

    </div>

    <footer>
        <p>im so TIRED omg. credits to kenzo for helping me ahahaa</p>
    </footer>
</div>

<script>
    function generateSKU()
    {
        let category = document.getElementById("category").value.trim().toUpperCase();
        let prodname = document.getElementById("product_name").value.trim().toUpperCase();
        let quantity = document.getElementById("quantity").value.trim();

        let random = Math.floor(Math.random() * 90 + 10);
        let sku = category + "-" + prodname + "-" + quantity + "-" + random;

      document.getElementById("output").innerHTML = <p><strong>Generated SKU:</strong>sku</p>;
    }

</script>

</body>
</html>
