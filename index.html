<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #8dbb38, #f49fb8);
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }


        .main-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(41, 95, 111, 0.2);
        }

        .header {
            background: #bd4f6c;
            color: white;
            padding: 30px;
            text-align: center;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<br>
<div class="container">
    <div class="card main-card">
        <div class="header">
            <h1>Receipt Generator</h1>
            <p class="mb-0">Gong Fu Teas and Supplies</p>
        </div>

        <div class="card-body p-4">

            <h2>Item List</h2>
            <br>
                <h4>Teas</h4>

                    <select class="form-control mb-3" id="tea">
                    <option value="0">Select Item</option>
                    <option value="90">Black Tea (PHP 90)</option>
                    <option value="100">Oolong Tea (PHP 100)</option>
                    <option value="100">White Tea (PHP 100)</option>
                    <option value="120">Sencha Tea (PHP 120)</option>
                    <option value="130">Jasmine Tea (PHP 130)</option>
                    <option value="150">Butterfly Pea Tea (PHP 150)</option>
                    </select>

                <br>

                <h4>Supplies</h4>

                    <select class="form-control mb-3" id="supply">
                    <option value="0">Select Item</option>
                    <option value="220">Gaiwan (PHP 220)</option>
                    <option value="120">Fairness Pitcher (PHP 120)</option>
                    <option value="100">Teacup (PHP 100)</option>
                    <option value="140">Tea Tray (PHP 140)</option>
                    <option value="100">Tea Pet - Unglazed (PHP 100)</option>
                    <option value="115">Tea Pet - Glazed (PHP 115)</option>
                    </select>

                <br>
                    <button onclick="generateSKU()">Generate SKU</button>

                <div class="output" id="output">+
                    <p>SKU will appear here.</p>
                </div>

        </div>

    </div>

    <footer>
        <p>im so TIRED omg. credits to kenzo for helping me ahahaa</p>
    </footer>

</div>

<script>

    function calculatePrice()
    {
        let Tea = Number(document.getElementById("tea").value);
        let Supply = Number(document.getElementById("supply").value);
        let tax = 0.12
        let total = Math.round((tea + supply) * tax);

        document.getElementById("result").innerHTML = "Tea Price PHP " + tea + "<br>" + "Supply Price PHP " + supply + "<br>" + "Total Amount PHP " + total;
    }

</script>
</body>
</html>
